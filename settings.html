<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Settings - OSC Archive</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/main.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
        <script src="script.js" defer></script>
    </head>
    
    <body>
        <header class="site-header">
            <div class="top-bg">
                <div class="wip" id="wip-banner">
                    <p>this website is still unfinished!</p>
                    <button id="close-wip-btn" class="close-banner-btn">&times;</button>
                </div>
            </div>
            <nav class="navbar">
                <div class="nav-container">
                    <a href="/osc-archive" class="nav-logo">osc archive</a>
                    <div class="nav-links">
                        <a href="index.html">home</a>
                    </div>
                </div>
            </nav>
        </header>

        <div class="main-wrapper">
            <header class="title-content">
                <div class="left-section" style="display: flex; align-items: flex-start; gap: 20px;">
                    <a href="index.html" class="back-btn" style="margin-top: 4px;">← back</a>
                    <div style="display: flex; flex-direction: column; align-items: flex-start;">
                        <h1 style="margin: 0; line-height: 1;">settings</h1>
                    </div>
                </div>
            </header>

            <div class="main-content" style="text-align: left;">
                <div style="display: flex; flex-direction: column; gap: 24px;">
                    
                    <div class="setting-item">
                        <label for="theme-select" style="font-weight: 600; display: block; margin-bottom: 8px;">Site Appearance</label>
                        <select id="theme-select" style="padding: 10px 14px; border-radius: 8px; background: var(--bg); color: var(--fg); border: 1px solid var(--accent); font-family: inherit; font-size: 0.95rem; cursor: pointer; width: 100%; max-width: 300px;">
                            <option value="nord">Nord (Default)</option>
                            <option value="green-dark">Green Dark</option>
                            <option value="green-light">Green Light</option>
                            <option value="light">Light</option>
                            <option value="dark">Dark</option>
                            <option value="oled">OLED</option>
                            <option value="yoyleberry">Yoyleberry</option>
                        </select>
                    </div>

                    <div class="setting-item">
                        <label style="font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 10px;">
                            <input type="checkbox" id="blur-toggle" checked style="width: 18px; height: 18px; cursor: pointer;">
                            Header Backdrop Blur
                        </label>
                    </div>

                </div>
            </div>
        </div>

        <footer>
            <p class="nav-logo">OSC Archive</p>
            <div class="footer-links">
                <a href="https://randomperson32-xd.github.io" target="_blank" rel="noopener noreferrer">check out my personal site!</a>
                <a href="https://randomperson32-xd.github.io/osc-archive/contact" target="_blank" rel="noopener noreferrer">contact info</a>
            </div>
        </footer>
    </body>

</html>
